<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲行动 - 小鱼的抽取终端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "WenQuanYi Micro Hei", sans-serif;
        }

        body {
            background: #fff5f8;
            color: #e66490;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(#ffccd5 2px, transparent 2px),
                radial-gradient(#ffccd5 2px, transparent 2px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .box {
            width: 100%;
            max-width: 1200px;
            background: #fff;
            border: 3px solid #ff99bb;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(255, 153, 187, 0.2);
            text-align: center;
            transform: rotate(-0.5deg);
        }

        .title {
            font-size: 28px;
            margin-bottom: 30px;
            background: linear-gradient(90deg, #ff6699, #ff3366);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 2px 2px 4px rgba(255, 102, 153, 0.1);
            font-weight: bold;
        }

        .home-buttons {
            margin: 40px 0;
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #ff99bb;
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 16px 40px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(255, 153, 187, 0.3);
            font-weight: bold;
        }

        .btn:hover {
            background: #ff6699;
            transform: scale(1.08) rotate(1deg);
            box-shadow: 0 6px 12px rgba(255, 102, 153, 0.4);
        }

        .btn:active {
            transform: scale(0.98) rotate(0.5deg);
        }

        .btn:disabled {
            background: #ffcccc;
            color: #ff9999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #singlePanel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin: 20px auto;
            max-width: 800px;
            display: none;
        }

        #teamPanel {
            display: none;
            margin: 20px auto;
            max-width: 800px;
        }

        .map-card {
            width: 140px;
            margin: 0 auto 20px;
        }

        .team-member {
            margin-bottom: 30px;
        }

        .member-title {
            color: #ff6699;
            font-size: 18px;
            margin-bottom: 10px;
            text-align: left;
            border-bottom: 2px dashed #ff99bb;
            padding-bottom: 5px;
            font-weight: bold;
        }

        .member-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .card {
            background: #fff0f5;
            border: 2px solid #ff99bb;
            border-radius: 15px;
            padding: 15px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(255, 153, 187, 0.1);
        }

        .card::before {
            content: "♥";
            position: absolute;
            top: 5px;
            right: 8px;
            color: #ff99bb;
            opacity: 0.5;
            font-size: 12px;
        }

        .card:hover {
            transform: translateY(-5px) rotate(1deg);
            box-shadow: 0 8px 15px rgba(255, 153, 187, 0.2);
        }

        .card img {
            width: 100%;
            height: 110px;
            object-fit: contain;
            background: #fff;
            border-radius: 10px;
            margin-bottom: 10px;
            color: #ff6699;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            border: 1px solid #ffcccc;
        }

        .card .name {
            color: #ff3366;
            font-weight: bold;
            font-size: 15px;
        }

        .card .label {
            font-size: 13px;
            margin-bottom: 5px;
            color: #ff99bb;
        }

        @keyframes spin {
            0% { opacity: 0.7; transform: scale(0.98) rotate(-1deg); }
            50% { opacity: 1; transform: scale(1.02) rotate(1deg); box-shadow: 0 0 20px #ff99bb; }
            100% { opacity: 0.7; transform: scale(0.98) rotate(-1deg); }
        }

        @keyframes flash {
            0% { border-color: #ff99bb; }
            50% { border-color: #ff3366; box-shadow: 0 0 20px #ffcccc; }
            100% { border-color: #ff99bb; }
        }

        .animate-spin {
            animation: spin 0.15s linear infinite;
        }

        .animate-flash {
            animation: flash 0.4s linear infinite;
        }

        .back-btn {
            background: #ffb3c6;
            margin-bottom: 10px;
            display: none;
        }

        .history-box {
            margin-top: 30px;
            text-align: left;
            background: #fff0f5;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #ffcccc;
        }

        .history-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ff6699;
            font-weight: bold;
        }

        .history-list {
            max-height: 250px;
            overflow-y: auto;
            border-top: 2px dashed #ffcccc;
            padding-top: 10px;
        }

        .history-item {
            padding: 8px 10px;
            border-bottom: 1px dashed #ffcccc;
            color: #ff6699;
            font-size: 14px;
            line-height: 1.5;
        }

        .history-item span {
            color: #ff3366;
            font-weight: bold;
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #fff0f5;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ffcccc;
            border-radius: 10px;
            border: 2px solid #fff0f5;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ff99bb;
        }

        @media (max-width: 768px) {
            #singlePanel, .member-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            .map-card {
                width: 100%;
            }
            .box {
                transform: rotate(0);
                padding: 20px;
            }
            .card:hover {
                transform: translateY(-3px) rotate(0);
            }
            .title {
                font-size: 24px;
            }
            .btn {
                padding: 12px 30px;
                font-size: 16px;
            }
        }

        #settingsPanel {
            display: none;
            margin: 20px auto;
            max-width: 900px;
            background: #fff0f5;
            border-radius: 15px;
            border: 2px solid #ff99bb;
            padding: 20px;
            text-align: left;
        }

        .settings-title {
            font-size: 20px;
            color: #ff6699;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px dashed #ff99bb;
            padding-bottom: 10px;
        }

        .settings-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #ffcccc;
        }

        .section-title {
            font-size: 18px;
            color: #ff3366;
            margin-bottom: 10px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: #ffb3c6;
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 5px 15px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            background: #ff99bb;
        }

        .item-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            border: 1px dashed #ffcccc;
            border-radius: 8px;
        }

        .item-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px;
            border-radius: 5px;
            transition: 0.2s;
        }

        .item-checkbox:hover {
            background: #fff5f8;
        }

        .item-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ff6699;
            cursor: pointer;
        }

        .item-checkbox label {
            color: #ff6699;
            cursor: pointer;
            font-size: 14px;
        }

        .settings-footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .save-btn {
            background: #ff6699;
        }

        .cancel-btn {
            background: #ffcccc;
        }
    </style>
</head>

// 设置相关全局变量

const teamBtn = teamPanel.querySelector('.btn');

    for (let type in data) {
        selectedItems[type] = data[type].map(item => item.name);

}

// 返回首页

// 渲染设置面板的勾选列表
function renderSettingsList(type) {
    const listElement = document.getElementById(`${type}List`);
    if (!listElement) return;
    
    listElement.innerHTML = '';
    
    data[type].forEach(item => {
        const checkboxDiv = document.createElement('div');
        checkboxDiv.className = 'item-checkbox';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `${type}_${item.name}`;
        checkbox.value = item.name;
        checkbox.checked = selectedItems[type].includes(item.name);
        
        const label = document.createElement('label');
        label.htmlFor = `${type}_${item.name}`;
        label.textContent = item.name;
        
        checkboxDiv.appendChild(checkbox);
        checkboxDiv.appendChild(label);
        listElement.appendChild(checkboxDiv);
    });
}

// 全选/取消全选
function selectAll(type) {
    const checkboxes = document.querySelectorAll(`#${type}List input[type="checkbox"]`);
    checkboxes.forEach(checkbox => {
        checkbox.checked = true;
    });
}

function deselectAll(type) {
    const checkboxes = document.querySelectorAll(`#${type}List input[type="checkbox"]`);
    checkboxes.forEach(checkbox => {
        checkbox.checked = false;
    });
}

// 保存设置
function saveSettings() {
    // 收集所有勾选的项目
    for (let type in data) {
        selectedItems[type] = [];
        const checkboxes = document.querySelectorAll(`#${type}List input[type="checkbox"]:checked`);
        checkboxes.forEach(checkbox => {
            selectedItems[type].push(checkbox.value);
        });
        
        // 防止全部取消勾选的情况
        if (selectedItems[type].length === 0) {
            alert(`⚠️ ${getTypeName(type)}不能全部取消勾选，已自动全选！`);
            selectedItems[type] = data[type].map(item => item.name);
            // 重新勾选所有选项
            selectAll(type);
        }
    }
    
    alert('✅ 设置保存成功！');
    goBack();
}

// 取消设置
function cancelSettings() {
    // 恢复勾选状态
    renderSettingsList('operator');
    renderSettingsList('map');
    renderSettingsList('primary');
    renderSettingsList('helmet');
    renderSettingsList('armor');
    goBack();
}

// 获取类型名称（用于提示）
function getTypeName(type) {
    const typeNames = {
        operator: '干员',
        map: '地图',
        primary: '主武器',
        helmet: '头盔',
        armor: '护甲'
    };
    return typeNames[type] || type;
}

// 随机抽取函数（只从勾选的数据中抽取）
function rand(arrType) {
    // 获取勾选的数据列表
    const filteredData = data[arrType].filter(item => selectedItems[arrType].includes(item.name));
    
    if (!filteredData || filteredData.length === 0) {
        return { name: "暂无数据", img: "" };
    }
    return filteredData[Math.floor(Math.random() * filteredData.length)];
}

// 抽卡动画函数
function startDrawAnimation(elements, duration = 1500) {
    // 禁用按钮
    if (elements.btn) elements.btn.disabled = true;
    
    // 给所有卡片添加动画类
    elements.cards.forEach(card => {
        const img = card.querySelector('img');
        const name = card.querySelector('.name');
        img.classList.add('animate-spin');
        card.classList.add('animate-flash');
        name.textContent = "抽取中...✨";
    });

    return new Promise(resolve => {
        // 动画结束后移除动画类
        setTimeout(() => {
            elements.cards.forEach(card => {
                const img = card.querySelector('img');
                img.classList.remove('animate-spin');
                card.classList.remove('animate-flash');
            });
            // 启用按钮
            if (elements.btn) elements.btn.disabled = false;
            resolve();
        }, duration);
    });
}

// 单人抽取逻辑
async function drawSingle() {
    // 获取所有单人卡片
    const singleCards = singlePanel.querySelectorAll('.card');
    // 启动抽卡动画
    await startDrawAnimation({
        cards: singleCards,
        btn: singleBtn
    });

    // 随机抽取各项数据
    const op = rand("operator");
    const map = rand("map");
    const wp = rand("primary");
    const ht = rand("helmet");
    const ar = rand("armor");

    // 更新DOM显示
    updateElement("s_op", op.img, op.name);
    updateElement("s_map", map.img, map.name);
    updateElement("s_wp", wp.img, wp.name);
    updateElement("s_ht", ht.img, ht.name);
    updateElement("s_ar", ar.img, ar.name);

    // 添加历史记录
    addHistory("单人", map.name, op.name, wp.name);
}

// 生成队员随机数据
function generatePlayerData() {
    return { 
        op: rand("operator"), 
        wp: rand("primary"), 
        ht: rand("helmet"), 
        ar: rand("armor") 
    };
}

// 更新队员显示
function updatePlayerDisplay(playerNum, playerData) {
    updateElement(`t${playerNum}_op`, playerData.op.img, playerData.op.name);
    updateElement(`t${playerNum}_wp`, playerData.wp.img, playerData.wp.name);
    updateElement(`t${playerNum}_ht`, playerData.ht.img, playerData.ht.name);
    updateElement(`t${playerNum}_ar`, playerData.ar.img, playerData.ar.name);
}

// 组队抽取逻辑
async function drawTeam() {
    // 获取所有组队卡片
    const teamCards = teamPanel.querySelectorAll('.card');
    // 启动抽卡动画
    await startDrawAnimation({
        cards: teamCards,
        btn: teamBtn
    });

    // 统一地图
    const map = rand("map");
    
    // 3名队员的随机数据
    const p1 = generatePlayerData();
    const p2 = generatePlayerData();
    const p3 = generatePlayerData();

    // 更新地图显示
    updateElement("t_map", map.img, map.name);

    // 更新队员显示
    updatePlayerDisplay(1, p1);
    updatePlayerDisplay(2, p2);
    updatePlayerDisplay(3, p3);

    // 添加历史记录
    addHistory(`组队(3人)`, map.name, `${p1.op.name}/${p2.op.name}/${p3.op.name}`, `${p1.wp.name}/${p2.wp.name}/${p3.wp.name}`);
}

// 辅助函数：更新图片和文本显示
function updateElement(id, imgSrc, text) {
    const imgEl = document.getElementById(id);
    const textEl = document.getElementById(`${id}_txt`);
    
    if (imgEl) {
        // 设置默认占位图
        imgEl.src = imgSrc || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#fff0f5"/><text x="50" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff6699">暂无图片</text></svg>';
        imgEl.alt = text;
        imgEl.onerror = function() {
            this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" fill="#fff0f5"/><text x="50" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#ff6699">图片加载失败 😢</text></svg>';
        };
    }
    if (textEl) {
        textEl.textContent = text;
    }
}

// 添加历史记录
function addHistory(type, mapName, op, wp) {
    const d = new Date();
    const time = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
    const item = document.createElement("div");
    item.className = "history-item";
    item.innerHTML = `[${time}] ${type} | 地图:<span>${mapName}</span> | 干员:<span>${op}</span> | 武器:<span>${wp}</span>`;
    historyList.insertBefore(item, historyList.firstChild);
    
    // 限制历史记录数量（最多20条）
    if (historyList.children.length > 20) {
        historyList.removeChild(historyList.lastChild);
    }
}
